name: Validate Pipeline

on:
  push:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Validate Files
      run: |
        echo "Checking required files..."
        if [ -f workflow/scripts/run_all_analyses.py ]; then
          lines=$(wc -l < workflow/scripts/run_all_analyses.py)
          echo "  PASS: run_all_analyses.py ($lines lines)"
        else
          echo "  FAIL: run_all_analyses.py MISSING"
          exit 1
        fi
        
        if [ -f README.md ]; then
          echo "  PASS: README.md"
        else
          echo "  FAIL: README.md MISSING"
          exit 1
        fi
        
        echo ""
        echo "Figures:"
        ls docs/figures/*.png 2>/dev/null && echo "  PASS: Figures found" || echo "  No figures (optional)"
        
        echo ""
        echo "VALIDATION PASSED - Kelton Guimaraes"

    - name: Python Syntax
      run: |
        python3 -m py_compile workflow/scripts/run_all_analyses.py
        echo "Python syntax OK"
